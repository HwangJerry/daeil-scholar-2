# Install as /etc/httpd/conf.d/00-alumni-ip-http.conf.
# HTTP-01 validation must remain reachable without DNS or an HTTPS redirect.
<VirtualHost *:80>
    ServerName 211.169.249.240
    DocumentRoot /var/lib/alumni-ip-acme/webroot
    <Directory /var/lib/alumni-ip-acme/webroot>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://211.169.249.240%{REQUEST_URI} [R=301,L]
    ErrorLog /var/log/httpd/alumni-ip-http-error_log
    CustomLog /var/log/httpd/alumni-ip-http-access_log combined
</VirtualHost>
