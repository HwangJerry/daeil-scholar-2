# httpd-admin.conf — adms.daeilfoundation.or.kr Apache VirtualHost (관리자 SPA + Go API)
# 배포: deploy/remote_release.py가 /etc/httpd/conf.d/alumni_admin.conf로 설치한다.
# 설치 파일 이름은 alumni.conf보다 뒤에 읽혀야 한다. 먼저 읽힌 vhost가 IP 직접 접속 등의 기본 서버가 되기 때문이다.
# 로그는 /var/log/httpd/에 둔다. /etc/logrotate.d/httpd(maxage 28)가 이 경로만 순환한다.

<VirtualHost *:80>
    ServerName adms.daeilfoundation.or.kr
    Redirect permanent / https://adms.daeilfoundation.or.kr/
</VirtualHost>

<VirtualHost *:443>
    ServerName adms.daeilfoundation.or.kr

    SSLEngine on
    # 같은 인증서가 adms.daeilfoundation.or.kr을 SAN으로 포함한다.
    SSLCertificateFile     /etc/letsencrypt/live/daeilfoundation.or.kr/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/daeilfoundation.or.kr/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/daeilfoundation.or.kr/chain.pem
    SSLProtocol            all -SSLv3 -TLSv1 -TLSv1.1

    # === Go 백엔드 프록시 (관리자 API와 로그인) ===
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/      http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # === 관리자 화면이 보여 주는 업로드 이미지·첨부 ===
    Alias /files/   /var/www/legacy/files/
    Alias /uploads/ /var/www/uploads/
    <Directory /var/www/legacy/files>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # === Admin SPA (루트 경로) ===
    DocumentRoot /var/www/admin
    <Directory /var/www/admin>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/files/
    RewriteCond %{REQUEST_URI} !^/uploads/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /index.html [L]

    ErrorLog  /var/log/httpd/admin-error_log
    CustomLog /var/log/httpd/admin-access_log combined
</VirtualHost>
