# Install after certificate issuance as /etc/httpd/conf.d/00-alumni-ip-ssl.conf.
# The first TLS vhost also serves clients that omit SNI for a literal IP address.
<VirtualHost *:443>
    ServerName 211.169.249.240
    SSLEngine on
    SSLCertificateFile /etc/alumni-ip-tls/certificates/211.169.249.240.crt
    SSLCertificateKeyFile /etc/alumni-ip-tls/certificates/211.169.249.240.key
    SSLCertificateChainFile /etc/alumni-ip-tls/certificates/211.169.249.240.issuer.crt
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    SetEnvIf Request_URI ^/api/messages/stream no-gzip=1
    ProxyTimeout 3600
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    <Location /api/admin/>
        Require all denied
    </Location>

    Alias /files/ /var/www/legacy/files/
    Alias /uploads/ /var/www/uploads/
    <Directory /var/www/legacy/files>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch 410 ^/old/
    RedirectMatch 404 ^/admin(/.*)?$
    DocumentRoot /var/www/app
    <Directory /var/www/app>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(api|files|uploads|assets|old|admin)(/|$)
    RewriteCond %{REQUEST_URI} !\.(html?|png|jpg|jpeg|gif|ico|svg|css|js|woff2?|ttf|eot|txt|xml|pdf|map)$
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /index.html [L]

    ErrorLog /var/log/httpd/alumni-ip-error_log
    CustomLog /var/log/httpd/alumni-ip-access_log combined
</VirtualHost>
